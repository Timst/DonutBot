[project]
name = "donutbot"
version = "1.2.1"
description = "Simple python bot to keep track of my Discord server's donut competition (don't ask)"
authors = [
    {name = "Timst",email = "timst44@gmail.com"}
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "py-cord (>=2.7.0,<3.0.0)",
    "openai (>=2.15.0,<3.0.0)",
    "inflect (>=7.5.0,<8.0.0)",
    "pytz (>=2025.2,<2026.0)",
    "toml (>=0.10.2,<0.11.0)",
    "pillow (>=12.1.0,<13.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "pathvalidate (>=3.3.1,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "matplotlib (>=3.10.8,<4.0.0)",
    "scipy (>=1.17.0,<2.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
